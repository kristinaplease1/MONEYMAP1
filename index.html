<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoneyMap — Personal Finance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f3;
            color: #222;
        }

        /* HEADER */

        header {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .btn {
            border: 1px solid #222;
            background: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #222;
            color: white;
        }

        .btn-dark {
            background: #222;
            color: white;
            border: 1px solid #222;
        }

        .btn-dark:hover {
            background: #444;
        }

        /* MAIN */

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px 50px;
        }

        /* CALENDAR */

        .calendar-box {
            background: white;
            border: 1px solid #e3e3e3;
            border-radius: 14px;
            padding: 25px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
        }

        .month-buttons {
            display: flex;
            gap: 8px;
        }

        .month-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 18px;
        }

        .month-btn:hover {
            background: #f1f1f1;
        }

        .weekdays,
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .weekday {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding-bottom: 12px;
        }

        .day {
            min-height: 78px;
            border: 1px solid #eee;
            margin: 2px;
            border-radius: 9px;
            padding: 9px;
            background: white;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }

        .day:hover {
            background: #f6f6f6;
        }

        .day-number {
            font-size: 13px;
            font-weight: 600;
        }

        .day.selected {
            background: #222;
            color: white;
        }

        .day.today {
            border: 2px solid #222;
        }

        .day-amount {
            position: absolute;
            bottom: 8px;
            left: 9px;
            font-size: 11px;
            color: #777;
        }

        .day.selected .day-amount {
            color: #ddd;
        }

        /* SELECTED DAY */

        .selected-section {
            margin-top: 25px;
            background: white;
            border: 1px solid #e3e3e3;
            border-radius: 14px;
            padding: 25px;
        }

        .selected-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .selected-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .expenses-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .expense-item {
            border: 1px solid #e5e5e5;
            border-radius: 9px;
            padding: 13px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .expense-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .category-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .expense-info {
            min-width: 0;
        }

        .expense-category {
            font-weight: 600;
            font-size: 14px;
        }

        .expense-description {
            color: #888;
            font-size: 12px;
            margin-top: 3px;
        }

        .expense-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .expense-amount {
            font-weight: 600;
            white-space: nowrap;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            background: #f5f5f5;
            border-radius: 6px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-btn:hover {
            background: #e5e5e5;
        }

        .delete-btn:hover {
            background: #ffe5e5;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 25px 0;
            font-size: 14px;
        }

        /* ANALYSIS */

        .analysis-section {
            display: none;
            margin-top: 25px;
            background: white;
            border: 1px solid #e3e3e3;
            border-radius: 14px;
            padding: 25px;
        }

        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .analysis-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .close-analysis {
            border: none;
            background: #f1f1f1;
            border-radius: 7px;
            width: 34px;
            height: 34px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 18px;
        }

        .stat-title {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
        }

        .analysis-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: center;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* PIE CHART */

        .chart-area {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pie-chart {
            width: 270px;
            height: 270px;
            border-radius: 50%;
            position: relative;
            background: #eeeeee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .pie-chart::after {
            content: "";
            position: absolute;
            width: 115px;
            height: 115px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 270px;
            overflow-y: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-name {
            flex: 1;
        }

        .legend-value {
            font-weight: 600;
        }

        /* MODAL */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 430px;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .modal h2 {
            margin: 0 0 22px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #888;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            header {
                padding: 18px 20px;
            }

            main {
                margin-top: 20px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .analysis-content {
                grid-template-columns: 1fr;
            }

            .calendar-box,
            .selected-section,
            .analysis-section {
                padding: 18px;
            }

            .day {
                min-height: 62px;
            }

            .day-amount {
                font-size: 9px;
            }
        }

        @media (max-width: 550px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
            }

            .calendar-header h2 {
                font-size: 17px;
            }

            .day {
                min-height: 50px;
                padding: 6px;
            }

            .day-number {
                font-size: 11px;
            }

            .day-amount {
                display: none;
            }

            .expense-item {
                align-items: flex-start;
            }

            .expense-right {
                gap: 5px;
            }

            .expense-amount {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo-area">
        <div class="logo">MONEYMAP</div>
        <div class="subtitle">
            Track where your money goes
        </div>
    </div>

    <div class="header-buttons">

        <button
            class="btn"
            onclick="showAnalysis()">
            ANALYZE
        </button>

        <button
            class="btn btn-dark"
            onclick="openAddExpense()">
            + EXPENSE
        </button>

    </div>

</header>


<main>

    <!-- CALENDAR -->

    <section class="calendar-box">

        <div class="calendar-header">

            <h2 id="monthTitle"></h2>

            <div class="month-buttons">

                <button
                    class="month-btn"
                    onclick="changeMonth(-1)">
                    ‹
                </button>

                <button
                    class="month-btn"
                    onclick="changeMonth(1)">
                    ›
                </button>

            </div>

        </div>


        <div class="weekdays">

            <div class="weekday">MON</div>
            <div class="weekday">TUE</div>
            <div class="weekday">WED</div>
            <div class="weekday">THU</div>
            <div class="weekday">FRI</div>
            <div class="weekday">SAT</div>
            <div class="weekday">SUN</div>

        </div>


        <div
            class="calendar"
            id="calendar">
        </div>

    </section>


    <!-- SELECTED DAY -->

    <section class="selected-section">

        <div class="selected-header">

            <h3 id="selectedDateTitle"></h3>

            <button
                class="btn btn-dark"
                onclick="openAddExpense()">
                + EXPENSE
            </button>

        </div>


        <div
            id="expensesList"
            class="expenses-list">
        </div>

    </section>


    <!-- ANALYSIS -->

    <section
        class="analysis-section"
        id="analysisSection">

        <div class="analysis-header">

            <h2>Spending Analysis</h2>

            <button
                class="close-analysis"
                onclick="closeAnalysis()">
                ×
            </button>

        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    TOTAL SPENT
                </div>

                <div
                    class="stat-value"
                    id="totalSpent">
                    €0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    AVERAGE PER DAY
                </div>

                <div
                    class="stat-value"
                    id="averageSpent">
                    €0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    TOP CATEGORY
                </div>

                <div
                    class="stat-value"
                    id="topCategory">
                    —
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    MOST EXPENSIVE DAY
                </div>

                <div
                    class="stat-value"
                    id="expensiveDay">
                    —
                </div>

            </div>

        </div>


        <div class="analysis-content">

            <div>

                <div class="chart-title">
                    Spending by category
                </div>

                <div class="chart-area">

                    <div
                        class="pie-chart"
                        id="pieChart">
                    </div>

                </div>

            </div>


            <div>

                <div class="chart-title">
                    Categories
                </div>

                <div
                    class="legend"
                    id="legend">
                </div>

            </div>

        </div>

    </section>

</main>


<!-- MODAL -->

<div
    class="modal-overlay"
    id="modalOverlay">

    <div class="modal">

        <h2 id="modalTitle">
            Add Expense
        </h2>


        <div class="form-group">

            <label>Date</label>

            <input
                type="date"
                id="expenseDate">

        </div>


        <div class="form-group">

            <label>Amount</label>

            <input
                type="number"
                id="expenseAmount"
                placeholder="0.00"
                min="0"
                step="0.01">

        </div>


        <div class="form-group">

            <label>Category</label>

            <select
                id="expenseCategory">
            </select>

        </div>


        <div class="form-group">

            <label>Description</label>

            <input
                type="text"
                id="expenseDescription"
                placeholder="What did you spend money on?">

        </div>


        <div class="modal-buttons">

            <button
                class="btn"
                onclick="closeModal()">
                Cancel
            </button>

            <button
                class="btn btn-dark"
                id="saveButton"
                onclick="saveExpense()">
                Add Expense
            </button>

        </div>

    </div>

</div>


<script>

    /* =========================
       DATA
    ========================= */

    let expenses =
        JSON.parse(
            localStorage.getItem(
                "moneymap_expenses"
            )
        ) || [];


    let currentDate =
        new Date();


    let selectedDate =
        new Date();


    let editingId = null;


    /* =========================
       CATEGORIES
    ========================= */

    const categories = [

        "Coffee",
        "Restaurants & Cafes",
        "Groceries",
        "Taxi",
        "Transport",
        "Car",
        "Clothes & Shoes",
        "Cosmetics & Care",
        "Beauty Procedures",
        "Sport",
        "Entertainment",
        "Travel",
        "Subscriptions",
        "Gifts",
        "Education",
        "Technology",
        "Home",
        "Health",
        "Phone & Internet",
        "Pets",
        "Other"

    ];


    /* =========================
       COLORS
    ========================= */

    const categoryColors = {

        "Coffee": "#FF922B",

        "Restaurants & Cafes": "#FF6B6B",

        "Groceries": "#51CF66",

        "Taxi": "#FFD43B",

        "Transport": "#339AF0",

        "Car": "#845EF7",

        "Clothes & Shoes": "#F06595",

        "Cosmetics & Care": "#E599F7",

        "Beauty Procedures": "#CC5DE8",

        "Sport": "#20C997",

        "Entertainment": "#15AABF",

        "Travel": "#4DABF7",

        "Subscriptions": "#748FFC",

        "Gifts": "#FF8787",

        "Education": "#63E6BE",

        "Technology": "#5C7CFA",

        "Home": "#82C91E",

        "Health": "#94D82D",

        "Phone & Internet": "#74C0FC",

        "Pets": "#D0BFFF",

        "Other": "#868E96"

    };


    /* =========================
       SAVE
    ========================= */

    function saveData() {

        localStorage.setItem(
            "moneymap_expenses",
            JSON.stringify(expenses)
        );

    }


    /* =========================
       DATE KEY
    ========================= */

    function dateKey(date) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    /* =========================
       MONEY
    ========================= */

    function money(value) {

        return "€" +
            Number(value).toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

    }


    /* =========================
       CALENDAR
    ========================= */

    function buildCalendar() {

        const calendar =
            document.getElementById(
                "calendar"
            );

        calendar.innerHTML = "";


        const year =
            currentDate.getFullYear();

        const month =
            currentDate.getMonth();


        const monthName =
            currentDate.toLocaleString(
                "en-US",
                {
                    month: "long",
                    year: "numeric"
                }
            );


        document.getElementById(
            "monthTitle"
        ).textContent =
            monthName.charAt(0).toUpperCase() +
            monthName.slice(1);


        const firstDay =
            new Date(
                year,
                month,
                1
            );


        let startDay =
            firstDay.getDay();


        if (startDay === 0) {
            startDay = 6;
        } else {
            startDay--;
        }


        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        for (
            let i = 0;
            i < startDay;
            i++
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            calendar.appendChild(
                empty
            );

        }


        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "day";


            const thisDate =
                new Date(
                    year,
                    month,
                    day
                );


            const key =
                dateKey(thisDate);


            if (
                dateKey(selectedDate) === key
            ) {

                cell.classList.add(
                    "selected"
                );

            }


            if (
                dateKey(new Date()) === key
            ) {

                cell.classList.add(
                    "today"
                );

            }


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "day-number";


            number.textContent =
                day;


            cell.appendChild(
                number
            );


            const dayExpenses =
                expenses.filter(
                    expense =>
                        expense.date === key
                );


            if (
                dayExpenses.length > 0
            ) {

                const total =
                    dayExpenses.reduce(
                        (sum, expense) =>
                            sum +
                            Number(
                                expense.amount
                            ),
                        0
                    );


                const amount =
                    document.createElement(
                        "div"
                    );


                amount.className =
                    "day-amount";


                amount.textContent =
                    money(total);


                cell.appendChild(
                    amount
                );

            }


            cell.addEventListener(
                "click",
                function() {

                    selectedDate =
                        new Date(
                            year,
                            month,
                            day
                        );

                    buildCalendar();

                    showSelectedDate();

                }
            );


            calendar.appendChild(
                cell
            );

        }

    }


    /* =========================
       SELECTED DATE
    ========================= */

    function showSelectedDate() {

        const title =
            document.getElementById(
                "selectedDateTitle"
            );


        title.textContent =
            selectedDate.toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );


        const key =
            dateKey(selectedDate);


        const list =
            document.getElementById(
                "expensesList"
            );


        list.innerHTML = "";


        const dayExpenses =
            expenses.filter(
                expense =>
                    expense.date === key
            );


        if (
            dayExpenses.length === 0
        ) {

            list.innerHTML =
                `
                <div class="empty">
                    No expenses for this day.
                </div>
                `;

            return;
        }


        dayExpenses.forEach(
            expense => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "expense-item";


                const color =
                    categoryColors[
                        expense.category
                    ] || "#868E96";


                const left =
                    document.createElement(
                        "div"
                    );


                left.className =
                    "expense-left";


                const dot =
                    document.createElement(
                        "div"
                    );


                dot.className =
                    "category-dot";


                dot.style.background =
                    color;


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "expense-info";


                const category =
                    document.createElement(
                        "div"
                    );


                category.className =
                    "expense-category";


                category.textContent =
                    expense.category;


                const description =
                    document.createElement(
                        "div"
                    );


                description.className =
                    "expense-description";


                description.textContent =
                    expense.description ||
                    "No description";


                info.appendChild(
                    category
                );

                info.appendChild(
                    description
                );


                left.appendChild(
                    dot
                );

                left.appendChild(
                    info
                );


                const right =
                    document.createElement(
                        "div"
                    );


                right.className =
                    "expense-right";


                const amount =
                    document.createElement(
                        "div"
                    );


                amount.className =
                    "expense-amount";


                amount.textContent =
                    money(
                        expense.amount
                    );


                /* EDIT BUTTON */

                const editButton =
                    document.createElement(
                        "button"
                    );


                editButton.className =
                    "edit-btn";


                editButton.textContent =
                    "✏️";


                editButton.title =
                    "Edit expense";


                editButton.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        editExpense(
                            expense.id
                        );

                    }
                );


                /* DELETE BUTTON */

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-btn";


                deleteButton.textContent =
                    "🗑️";


                deleteButton.title =
                    "Delete expense";


                deleteButton.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        deleteExpense(
                            expense.id
                        );

                    }
                );


                right.appendChild(
                    amount
                );

                right.appendChild(
                    editButton
                );

                right.appendChild(
                    deleteButton
                );


                item.appendChild(
                    left
                );

                item.appendChild(
                    right
                );


                list.appendChild(
                    item
                );

            }
        );

    }


    /* =========================
       FILL CATEGORIES
    ========================= */

    function fillCategories() {

        const select =
            document.getElementById(
                "expenseCategory"
            );


        select.innerHTML = "";


        categories.forEach(
            category => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    category;


                option.textContent =
                    category;


                select.appendChild(
                    option
                );

            }
        );

    }


    /* =========================
       ADD EXPENSE
    ========================= */

    function openAddExpense() {

        editingId = null;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add Expense";


        document.getElementById(
            "saveButton"
        ).textContent =
            "Add Expense";


        document.getElementById(
            "expenseDate"
        ).value =
            dateKey(selectedDate);


        document.getElementById(
            "expenseAmount"
        ).value =
            "";


        document.getElementById(
            "expenseCategory"
        ).value =
            "Coffee";


        document.getElementById(
            "expenseDescription"
        ).value =
            "";


        document.getElementById(
            "modalOverlay"
        ).style.display =
            "flex";

    }


    /* =========================
       EDIT EXPENSE
    ========================= */

    function editExpense(id) {

        const expense =
            expenses.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!expense) {

            alert(
                "Expense not found."
            );

            return;
        }


        editingId =
            expense.id;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Expense";


        document.getElementById(
            "saveButton"
        ).textContent =
            "Save Changes";


        document.getElementById(
            "expenseDate"
        ).value =
            expense.date;


        document.getElementById(
            "expenseAmount"
        ).value =
            expense.amount;


        document.getElementById(
            "expenseCategory"
        ).value =
            expense.category;


        document.getElementById(
            "expenseDescription"
        ).value =
            expense.description || "";


        document.getElementById(
            "modalOverlay"
        ).style.display =
            "flex";

    }


    /* =========================
       SAVE EXPENSE
    ========================= */

    function saveExpense() {

        const date =
            document.getElementById(
                "expenseDate"
            ).value;


        const amount =
            Number(
                document.getElementById(
                    "expenseAmount"
                ).value
            );


        const category =
            document.getElementById(
                "expenseCategory"
            ).value;


        const description =
            document.getElementById(
                "expenseDescription"
            ).value.trim();


        if (!date) {

            alert(
                "Please select a date."
            );

            return;
        }


        if (
            !amount ||
            amount <= 0
        ) {

            alert(
                "Please enter a valid amount."
            );

            return;
        }


        /* =========================
           EDIT EXISTING
        ========================= */

        if (editingId !== null) {

            const index =
                expenses.findIndex(
                    item =>
                        String(item.id) ===
                        String(editingId)
                );


            if (index !== -1) {

                expenses[index].date =
                    date;

                expenses[index].amount =
                    amount;

                expenses[index].category =
                    category;

                expenses[index].description =
                    description;

            }

        }

        /* =========================
           ADD NEW
        ========================= */

        else {

            expenses.push({

                id:
                    Date.now().toString(),

                date:
                    date,

                amount:
                    amount,

                category:
                    category,

                description:
                    description

            });

        }


        saveData();


        selectedDate =
            new Date(
                date + "T00:00:00"
            );


        currentDate =
            new Date(
                selectedDate
            );


        editingId = null;


        closeModal();


        buildCalendar();


        showSelectedDate();

    }


    /* =========================
       DELETE
    ========================= */

    function deleteExpense(id) {

        const expense =
            expenses.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (!expense) return;


        const answer =
            confirm(
                "Delete this expense?"
            );


        if (!answer) return;


        expenses =
            expenses.filter(
                item =>
                    String(item.id) !==
                    String(id)
            );


        saveData();


        buildCalendar();


        showSelectedDate();

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

        document.getElementById(
            "modalOverlay"
        ).style.display =
            "none";


        editingId = null;

    }


    /* =========================
       CLOSE MODAL BY CLICKING OUTSIDE
    ========================= */

    document.getElementById(
        "modalOverlay"
    ).addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeModal();

            }

        }
    );


    /* =========================
       CHANGE MONTH
    ========================= */

    function changeMonth(direction) {

        currentDate.setMonth(
            currentDate.getMonth() +
            direction
        );


        buildCalendar();

    }


    /* =========================
       ANALYSIS
    ========================= */

    function showAnalysis() {

        const section =
            document.getElementById(
                "analysisSection"
            );


        section.style.display =
            "block";


        calculateAnalysis();


        setTimeout(
            function() {

                section.scrollIntoView({
                    behavior: "smooth"
                });

            },
            50
        );

    }


    function closeAnalysis() {

        document.getElementById(
            "analysisSection"
        ).style.display =
            "none";

    }


    /* =========================
       CALCULATE ANALYSIS
    ========================= */

    function calculateAnalysis() {

        const total =
            expenses.reduce(
                (sum, expense) =>
                    sum +
                    Number(
                        expense.amount
                    ),
                0
            );


        document.getElementById(
            "totalSpent"
        ).textContent =
            money(total);


        const uniqueDays =
            new Set(
                expenses.map(
                    expense =>
                        expense.date
                )
            );


        const average =
            uniqueDays.size > 0
                ? total / uniqueDays.size
                : 0;


        document.getElementById(
            "averageSpent"
        ).textContent =
            money(average);


        /* CATEGORY TOTALS */

        const categoryTotals = {};


        expenses.forEach(
            expense => {

                if (
                    !categoryTotals[
                        expense.category
                    ]
                ) {

                    categoryTotals[
                        expense.category
                    ] = 0;

                }


                categoryTotals[
                    expense.category
                ] +=
                    Number(
                        expense.amount
                    );

            }
        );


        const sortedCategories =
            Object.entries(
                categoryTotals
            ).sort(
                (a, b) =>
                    b[1] - a[1]
            );


        /* TOP CATEGORY */

        document.getElementById(
            "topCategory"
        ).textContent =
            sortedCategories.length
                ? sortedCategories[0][0]
                : "—";


        /* EXPENSIVE DAY */

        const dayTotals = {};


        expenses.forEach(
            expense => {

                if (
                    !dayTotals[
                        expense.date
                    ]
                ) {

                    dayTotals[
                        expense.date
                    ] = 0;

                }


                dayTotals[
                    expense.date
                ] +=
                    Number(
                        expense.amount
                    );

            }
        );


        const sortedDays =
            Object.entries(
                dayTotals
            ).sort(
                (a, b) =>
                    b[1] - a[1]
            );


        if (
            sortedDays.length
        ) {

            const date =
                new Date(
                    sortedDays[0][0] +
                    "T00:00:00"
                );


            document.getElementById(
                "expensiveDay"
            ).textContent =
                date.toLocaleDateString(
                    "en-US",
                    {
                        day: "numeric",
                        month: "short"
                    }
                );

        } else {

            document.getElementById(
                "expensiveDay"
            ).textContent =
                "—";

        }


        /* PIE CHART */

        const pie =
            document.getElementById(
                "pieChart"
            );


        const legend =
            document.getElementById(
                "legend"
            );


        legend.innerHTML = "";


        if (
            sortedCategories.length === 0
        ) {

            pie.style.background =
                "#eeeeee";


            legend.innerHTML =
                `
                <div class="empty">
                    Add some expenses to see the chart.
                </div>
                `;

            return;
        }


        let currentAngle = 0;


        const gradientParts = [];


        sortedCategories.forEach(
            ([category, value]) => {

                const percentage =
                    value / total * 100;


                const angle =
                    percentage * 3.6;


                const color =
                    categoryColors[
                        category
                    ] || "#868E96";


                gradientParts.push(
                    `${color} ${currentAngle}deg ${currentAngle + angle}deg`
                );


                currentAngle +=
                    angle;


                const legendItem =
                    document.createElement(
                        "div"
                    );


                legendItem.className =
                    "legend-item";


                const colorBox =
                    document.createElement(
                        "div"
                    );


                colorBox.className =
                    "legend-color";


                colorBox.style.background =
                    color;


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "legend-name";


                name.textContent =
                    category;


                const valueText =
                    document.createElement(
                        "div"
                    );


                valueText.className =
                    "legend-value";


                valueText.textContent =
                    percentage.toFixed(1) +
                    "%";


                legendItem.appendChild(
                    colorBox
                );

                legendItem.appendChild(
                    name
                );

                legendItem.appendChild(
                    valueText
                );


                legend.appendChild(
                    legendItem
                );

            }
        );


        pie.style.background =
            `conic-gradient(${gradientParts.join(", ")})`;

    }


    /* =========================
       START
    ========================= */

    fillCategories();

    buildCalendar();

    showSelectedDate();

</script>
